services:
  postgres:
    image: postgres:16-alpine
    container_name: autoflex-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: autoflex
      POSTGRES_PASSWORD: autoflex
      POSTGRES_DB: autoflex
    volumes:
      - autoflex_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U autoflex -d autoflex']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  autoflex_pg_data:
